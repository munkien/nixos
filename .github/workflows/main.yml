name: "Flake.lock: update Nix dependencies"

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '0 3 * * *'

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [pc-anders, server-home-1]
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          pr-title: "Update Nix flake inputs" 
          pr-labels: |    
            dependencies
            automated
            
      - name: Run flake generator
        run: nix run .#write-flake

      - name: Commit generated flake.nix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          # Only commit if there are staged changes to avoid failing the workflow
          git diff --staged --quiet || git commit -m "chore: auto-regenerate flake.nix"

      - name: Dry-run build host configuration
        run: nix build --dry-run .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Enable Auto-Merge
        if: steps.update.outputs.pull-request-operation == 'created'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.update.outputs.pull-request-number }}"
