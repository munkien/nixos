name: "Fleet checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The gate that must pass. These are evaluation-level assertions over the
  # evaluated host configs (see flake-parts/tests.nix). They are cheap, so it is
  # reasonable to run them on every push to main — which is also the deploy
  # branch that comin follows, so a red result here is the only thing standing
  # between a typo and every host self-deploying it.
  fleet-assertions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - fleet-assertions-pc-anders
          - fleet-assertions-server-home-1
          - fleet-assertions-no-colmena
          - fleet-assertions-user-options
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run ${{ matrix.check }}
        run: nix build -L ".#checks.x86_64-linux.${{ matrix.check }}"

  # Every host configuration must still evaluate and build. This catches a
  # broken module before a host with comin pulls it from main.
  hosts-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [pc-anders, server-home-1]
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Dry-run build ${{ matrix.host }}
        run: nix build --dry-run ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # Full `nix flake check`: lint hooks, the flake-file generator check, and the
  # fleet assertions. This is a hard gate — all checks pass as of commit
  # 18ff681. (check-flake-file used to fail on lockfile pruning drift; that was
  # fixed by flattening the duplicate nixpkgs/nixpkgs-lib inputs in flake.lock.)
  #
  # If check-flake-file ever fails again, the cause is almost always a flake.lock
  # whose duplicate inputs are no longer collapsed. Fix it with flake-file's own
  # pruner rather than by hand:
  #     nix-auto-follow flake.lock pruned.lock && mv pruned.lock flake.lock
  # Note that `nix run .#write-flake` does NOT persist this, because prune-lock
  # runs in a build sandbox and cannot write back to the source tree.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: nix flake check
        run: nix flake check --no-write-lock-file -L
