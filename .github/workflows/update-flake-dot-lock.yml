name: "Flake.lock: update Nix dependencies"

on:
  workflow_dispatch:
  schedule:
    - cron: '39 4 * * *'

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: DeterminateSystems/determinate-nix-action@v3
      
      - uses: DeterminateSystems/update-flake-lock@v24 # Pin to a specific version for reliability
        with:
          pr-title: "chore: update flake.lock" # Conventional commits style
          pr-labels: |
            dependencies
            automated
